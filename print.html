<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tulostusversio – Kurssikaveri</title>
  <style>
    /* Siisti tulostusversio: luettava sivu ruudulla, paperilla ilman yläpalkkia */
    :root { color-scheme: light; }
    body { margin: 0; background: #f6f3ec; color: #1f2420; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .bar { position: sticky; top: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 24px;
      background: #28513f; color: #fff; font-size: 14px; }
    .bar b { font-size: 15px; }
    .bar span { opacity: .9; }
    .bar button { margin-left: auto; min-height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: #fff; color: #1e3a2d;
      font: inherit; font-weight: 700; cursor: pointer; }
    .bar button:focus-visible { outline: 3px solid #f6c86a; outline-offset: 2px; }
    main { max-width: 760px; margin: 28px auto 60px; padding: 40px 48px; background: #fff; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .src { margin: 0 0 24px; padding-bottom: 14px; border-bottom: 1px solid #e5dfd4; color: #5c625d; font-size: 13.5px; word-break: break-all; }
    h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; }
    article h1 { font-size: 26px; }
    article h2 { font-size: 22px; margin-top: 1.6em; }
    article h3 { font-size: 18px; margin-top: 1.4em; }
    article img { max-width: 100%; height: auto; }
    article pre { padding: 12px 14px; background: #f3f1ec; border-radius: 8px; overflow-x: auto; font-size: 13.5px; white-space: pre-wrap; }
    article code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .92em; }
    article blockquote { margin: 1em 0; padding: 2px 16px; border-left: 4px solid #c9c2b5; color: #3d433e; }
    article table { border-collapse: collapse; width: 100%; font-size: 14px; }
    article th, article td { border: 1px solid #ddd5c6; padding: 6px 8px; text-align: left; vertical-align: top; }
    article a { color: #28513f; }
    .empty { max-width: 560px; margin: 60px auto; padding: 24px; background: #fff; border-radius: 14px; }
    @media print {
      .bar { display: none; }
      body { background: #fff; }
      main { margin: 0; padding: 0; max-width: none; box-shadow: none; border-radius: 0; }
      article a { color: inherit; }
      article pre, article table, article img, article blockquote { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <b>Siisti tulostusversio</b>
    <span>Valitse tulostimeksi <b>Tallenna PDF-muodossa</b>, niin saat PDF-tiedoston.</span>
    <button type="button" id="print">Tulosta tai tallenna PDF</button>
  </div>
  <main id="page" aria-live="polite"></main>
  <script type="module" src="print.js"></script>
</body>
</html>
